name: Sugerir uma melhoria
description: Compartilhe uma ideia para o NFiles Radio
title: "[Ideia]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema a ideia resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área da sugestão
      options:
        - Rádio e reprodução
        - Player de música
        - Letras e metadados
        - Descoberta
        - Interface e acessibilidade
        - Spotify ou YouTube
        - Outro
    validations:
      required: true
