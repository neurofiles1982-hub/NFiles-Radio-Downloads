name: Publish updater release 2.0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.0.3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout verified upload
        uses: actions/checkout@v4
        with:
          ref: release-upload-v2.0.3

      - name: Verify installer checksum
        id: verify
        shell: pwsh
        run: |
          $expected = (Get-Content "NFilesRadio-Setup.exe.sha256" -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash "NFilesRadio-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer checksum mismatch." }

      - name: Publish updater release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: NFiles Radio 2.0.3
          body: |
            Atualização 2.0.3 do NFiles Radio para instalações feitas pelo instalador EXE.

            O aplicativo valida o SHA-256 antes de iniciar a atualização automática.
          files: |
            NFilesRadio-Setup.exe
            NFilesRadio-Setup.exe.sha256
          fail_on_unmatched_files: true

      - name: Record publication result
        if: always()
        shell: pwsh
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          $installer = Get-Item "NFilesRadio-Setup.exe"
          $hash = (Get-Content "NFilesRadio-Setup.exe.sha256" -Raw).Trim().ToLowerInvariant()
          git fetch origin main
          git checkout -B main origin/main
          @(
            "release=v2.0.3"
            "verify=$env:VERIFY_OUTCOME"
            "publish=$env:RELEASE_OUTCOME"
            "asset=NFilesRadio-Setup.exe"
            "bytes=$($installer.Length)"
            "sha256=$hash"
            "workflow_run=$env:GITHUB_RUN_ID"
          ) | Set-Content "RELEASE-2.0.3-STATUS.txt" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-2.0.3-STATUS.txt
          git commit -m "chore: confirm updater release v2.0.3"
          git push origin HEAD:main
